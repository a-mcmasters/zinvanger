<!doctype html>
<!-- Throwaway U3 prototype. Three video-overlay layouts, ?variant=A|B|C. All actions simulated; no services or Anki writes. Open this file directly. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Living subtitle explorations</title>
<style>
:root{--foreground:#eeeaf5;--muted-foreground:#aba3b8;--card:#211a2e;--border:#453953;--primary:#c4a1ff;--radius:16px;--font-sans:Inter,system-ui,sans-serif;--ink:#faf6ff;--glass:rgba(28,24,38,.94)}
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--primary);outline-offset:4px}button{color:inherit}p{line-height:1.6}.intro{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:8px 0 15px}.intro small,.description,.foot{color:var(--muted-foreground)}.intro strong{display:block;font-size:21px;letter-spacing:-.6px}.badge{font-size:10px;letter-spacing:1.5px;border:1px solid var(--border);padding:7px 9px;border-radius:20px;white-space:nowrap}
.stage{position:relative;height:460px;border-radius:var(--radius);overflow:hidden;color:var(--ink);background:linear-gradient(180deg,#617e86 0%,#b3ada0 50%,#3c5354 51%,#243337 100%);isolation:isolate}.scene{position:absolute;inset:0;overflow:hidden;opacity:.8}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,22,.18),transparent 35%,rgba(8,10,20,.9));}.house{position:absolute;bottom:40%;width:15%;height:40%;background:#473d39;box-shadow:inset 0 0 0 5px #302d2b;clip-path:polygon(0 21%,50% 0,100% 21%,100% 100%,0 100%)}.house:after{content:'';position:absolute;inset:30% 20% 10%;background:repeating-linear-gradient(0deg,transparent 0 18px,#a99d7b 19px 34px,transparent 35px 48px);border-left:8px solid #262d30;border-right:8px solid #262d30}.h1{left:-3%;height:51%}.h2{left:14%;height:58%;background:#68594b}.h3{left:31%;height:48%}.h4{left:49%;height:61%;background:#776b58}.h5{left:67%;height:49%;background:#685148}.h6{left:85%;height:58%}.water{position:absolute;left:0;right:0;bottom:0;height:40%;background:repeating-linear-gradient(177deg,transparent 0 12px,#b5b8a122 13px 14px,transparent 15px 24px)}.scene-label{position:absolute;top:20px;left:22px;font-size:11px;letter-spacing:1.4px}.playstate{position:absolute;top:19px;right:20px;font-size:11px;border:1px solid #ffffff35;background:#17232b77;border-radius:20px;padding:6px 10px}.progress{position:absolute;bottom:18px;left:22px;right:22px;font-size:10px;color:#d0cbd6}.track{height:2px;background:#ffffff30;margin-bottom:9px}.track:before{content:'';display:block;height:2px;width:32%;background:#c4a1ff}.time{float:right}.interaction{position:absolute;left:18px;right:18px;bottom:69px;display:flex;align-items:center;flex-direction:column;gap:13px}.sentence{font-size:clamp(21px,3.4vw,29px);font-weight:550;letter-spacing:-.6px;text-align:center;text-shadow:0 2px 8px #000}.word{background:none;border:0;padding:2px 1px;font:inherit;border-radius:5px}.word:hover{background:#ffffff24}.word.selected{color:#e2ceff;text-decoration:underline;text-decoration-color:#c4a1ff;text-underline-offset:7px}.actions{display:flex;align-items:center;padding:5px;border:1px solid #ffffff25;border-radius:99px;background:var(--glass);box-shadow:0 8px 30px #0004;gap:2px}.actions button{background:none;border:0;border-radius:30px;padding:10px 13px;font-size:12px;white-space:nowrap}.actions button:hover{background:#ffffff15}.actions .mine{background:#c4a1ff;color:#241239;font-weight:650}.symbol{font-size:17px;margin-right:5px;vertical-align:-1px}.translation{font-size:15px;color:#eee3fb;text-align:center;margin:0;padding:0 12px}.lookup{position:absolute;bottom:202px;left:50%;transform:translateX(-50%);width:280px;border:1px solid #766286;background:var(--glass);border-radius:16px;padding:17px;box-shadow:0 16px 45px #0005}.lookup .top{display:flex;justify-content:space-between;align-items:center}.lookup strong{font-size:22px;letter-spacing:-.5px}.close{background:none;border:0;color:#d0c1df;font-size:20px}.meaning{font-size:14px;margin:6px 0 3px}.context{font-size:12px;line-height:1.5;color:#c5b9d4;margin:0 0 14px}.target{width:100%;padding:10px;border:1px solid #857295;border-radius:9px;background:#c4a1ff18;font-size:12px}.eyebrow{font-size:9px;letter-spacing:1.5px;color:#c4a1ff}.B .interaction{left:28px;right:28px;align-items:stretch;background:var(--glass);padding:20px;border:1px solid #ffffff26;border-radius:20px;gap:12px}.B .sentence{text-align:left;font-size:25px}.B .actions{background:transparent;box-shadow:none;border:0;border-top:1px solid #ffffff20;border-radius:0;padding:10px 0 0;justify-content:space-between}.B .translation{text-align:left;padding:0}.B .lookup{bottom:259px;left:28px;transform:none;width:280px}.C .interaction{left:32px;right:32px;align-items:flex-start;border-left:2px solid #c4a1ff;padding-left:18px;gap:13px}.C .sentence{text-align:left;font-family:Georgia,serif;font-weight:400;font-size:29px}.C .actions{border:0;box-shadow:none;background:transparent;padding:0;gap:12px}.C .actions button{padding:5px 0;border-radius:0;border-bottom:1px solid #ffffff55}.C .actions .mine{background:transparent;color:#d8bcff}.C .translation{text-align:left;padding:0}.C .lookup{left:auto;right:24px;transform:none;bottom:214px;border-radius:4px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.controls button{border:1px solid var(--border);background:transparent;border-radius:8px;padding:9px 12px;font-size:12px}.controls button.active{background:var(--card);border-color:var(--primary);color:var(--primary)}.description{font-size:13px;margin:10px 0 16px;min-height:42px}.switcher{position:sticky;bottom:8px;margin:12px auto;width:fit-content;display:flex;align-items:center;gap:15px;padding:7px 12px;border-radius:30px;background:var(--card);border:1px solid var(--border);box-shadow:0 8px 25px #0003;font-size:12px}.switcher button{background:transparent;border:0;padding:4px 8px;font-size:18px}.foot{font-size:11px;text-align:center;margin:13px 0}.toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);padding:9px 14px;border-radius:20px;background:#211a2e;font-size:12px;white-space:nowrap}.hidden{display:none!important}@media(max-width:480px){.stage{height:490px}.actions button{font-size:10px;padding:10px 8px}.symbol{margin-right:3px;font-size:14px}.B .interaction{left:12px;right:12px;padding:14px}.C .interaction{left:15px;right:15px}.C .actions{gap:14px}.lookup{bottom:218px}.B .lookup{bottom:280px;left:15px}.intro strong{font-size:18px}}
</style></head><body>
<div class="intro"><div><small>Living subtitles · U3</small><strong id="title">A / Floating glass</strong></div><span class="badge">INTERACTIVE MOCKUP</span></div>
<div class="stage A" id="stage">
 <div class="scene" aria-hidden="true"><div class="house h1"></div><div class="house h2"></div><div class="house h3"></div><div class="house h4"></div><div class="house h5"></div><div class="house h6"></div><div class="water"></div></div>
 <div class="scene-label">EEN DAG IN UTRECHT</div><div class="playstate" id="playstate">Ⅱ Paused</div>
 <div class="lookup hidden" id="lookup"><div class="eyebrow">DUTCH → ENGLISH</div><div class="top"><strong id="lookupWord">gezellig</strong><button class="close" aria-label="Close word lookup" onclick="closeLookup()">×</button></div><p class="meaning" id="meaning">cozy; warm and sociable</p><p class="context" id="context">Here: enjoying a pleasant atmosphere together.</p><button class="target" id="target" onclick="chooseTarget()">＋ Use as target word</button></div>
 <div class="interaction"><div class="sentence" id="sentence"></div><div class="actions"><button onclick="replay()"><span class="symbol">↺</span>Replay</button><button onclick="lookup('gezellig')"><span class="symbol">⌕</span>Look up</button><button onclick="toggleEnglish()" id="englishButton"><span class="symbol">文</span>English</button><button class="mine" onclick="mine()"><span class="symbol">＋</span>Mine</button></div><p class="translation hidden" id="translation">It's always so cozy here by the canal.</p></div>
 <div class="progress"><div class="track"></div>Ⅱ &nbsp; 04:32 <span class="time">14:08 &nbsp; ⛶</span></div><div id="toast" class="toast hidden" role="status"></div>
</div>
<div class="controls" aria-label="Preview state"><button onclick="setState('strip')" id="state-strip">01 · Sentence actions</button><button onclick="setState('word')" id="state-word">02 · Word lookup</button><button onclick="setState('english')" id="state-english">03 · English revealed</button></div>
<p class="description" id="description"></p>
<div class="switcher"><button onclick="cycle(-1)" aria-label="Previous design">←</button><span id="variantLabel">A · Floating glass</span><button onclick="cycle(1)" aria-label="Next design">→</button></div>
<p class="foot" id="stateInfo"></p>
<script>
const variants={A:['Floating glass','The subtitle stays independent. A small glass pill appears beneath it, with the word card floating above. Closest to the current spec.'],B:['One study surface','Sentence, translation and actions share a single glass surface. More stable and easier to scan, but covers more of the picture.'],C:['Quiet typography','A left-aligned subtitle with a violet edge and simple text actions. Less app chrome; the lookup sits to the right.']};
const definitions={Het:['It','Part of “Het is”: “It is”.'],is:['is','From zijn, “to be”.'],hier:['here','Refers to this place by the canal.'],altijd:['always','Something that happens every time.'],zo:['so','Emphasizes how pleasant it is.'],gezellig:['cozy; warm and sociable','Here: enjoying a pleasant atmosphere together.'],aan:['by; beside','Here: describing the location beside the canal.'],de:['the','The definite article in “de gracht”.'],gracht:['canal','An urban waterway, often lined with houses.']};
let variant=new URLSearchParams(location.search).get('variant')||'A',english=false,selected='',chosen='',state='strip',timer;
const el=id=>document.getElementById(id);
for(const w of ['Het','is','hier','altijd','zo','gezellig','aan','de','gracht']){const b=document.createElement('button');b.className='word';b.textContent=w;b.dataset.word=w;b.onclick=()=>lookup(w);el('sentence').append(b,document.createTextNode(w==='gracht'?'.':' '));}
function report(){el('stateInfo').textContent='Prototype only · '+variant+' · '+(english?'English visible':'Dutch only')+' · Target: '+(chosen||'none')+' · Illustrated video backdrop';document.querySelectorAll('.word').forEach(b=>b.classList.toggle('selected',b.dataset.word===(chosen||selected)));document.querySelectorAll('.controls button').forEach(b=>b.classList.toggle('active',b.id==='state-'+state));}
function lookup(w){selected=w;el('lookupWord').textContent=w;el('meaning').textContent=definitions[w][0];el('context').textContent=definitions[w][1];el('lookup').classList.remove('hidden');el('target').textContent=chosen===w?'✓ Target word selected':'＋ Use as target word';el('playstate').textContent='Ⅱ Paused';state='word';report();}
function closeLookup(){el('lookup').classList.add('hidden');selected='';report();}
function chooseTarget(){chosen=selected;el('target').textContent='✓ Target word selected';report();}
function toggleEnglish(){english=!english;el('translation').classList.toggle('hidden',!english);el('englishButton').innerHTML='<span class="symbol">文</span>'+(english?'Hide English':'English');el('playstate').textContent='Ⅱ Paused';state=english?'english':'strip';report();}
function toast(text){clearTimeout(timer);el('toast').textContent=text;el('toast').classList.remove('hidden');timer=setTimeout(()=>el('toast').classList.add('hidden'),2400);}
function replay(){closeLookup();el('playstate').textContent='▶ Replaying sentence';toast('Replay preview · 04:32–04:36');setTimeout(()=>el('playstate').textContent='Ⅱ Paused',1800);}
function mine(){toast('Mock card prepared'+(chosen?' · '+chosen:''));}
function setState(s){state=s;chosen='';selected='';english=s==='english';el('translation').classList.toggle('hidden',!english);el('englishButton').innerHTML='<span class="symbol">文</span>'+(english?'Hide English':'English');el('lookup').classList.add('hidden');if(s==='word')lookup('gezellig');report();}
function render(){if(!variants[variant])variant='A';el('stage').className='stage '+variant;el('title').textContent=variant+' / '+variants[variant][0];el('variantLabel').textContent=variant+' · '+variants[variant][0];el('description').textContent=variants[variant][1];report();}
function cycle(d){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3];try{const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);}catch{}render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLookup();if(['ArrowLeft','ArrowRight'].includes(e.key)&&!e.target.matches('input,textarea,[contenteditable],.word')){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});setState('word');render();
</script></body></html>
