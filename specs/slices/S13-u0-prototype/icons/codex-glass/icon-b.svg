      <stop offset=".42" stop-color="#b78aff"/>
      <stop offset="1" stop-color="#8245e9" stop-opacity=".51"/>
    </linearGradient>
    <linearGradient id="bottom" x1="36" y1="65" x2="96" y2="106" gradientUnits="userSpaceOnUse">
