    </radialGradient>
    <path id="silhouette" d="M27 44L51 22Q64 10 77 22L101 44Q112 54 112 64Q112 74 101 84L77 106Q64 118 51 106L27 84Q16 74 16 64Q16 54 27 44Z"/>
