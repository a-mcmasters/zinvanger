    <radialGradient id="depth" cx="64" cy="64" r="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#672c9c"/>
      <stop offset=".68" stop-color="#35135b"/>
      <stop offset="1" stop-color="#221033"/>
    </radialGradient>
    <linearGradient id="top" x1="30" y1="23" x2="90" y2="73" gradientUnits="userSpaceOnUse">
