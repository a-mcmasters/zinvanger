<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img">
  <title>Zinvanger — Folded Prism</title>
  <defs>
    <linearGradient id="base" x1="13" y1="15" x2="111" y2="113" gradientUnits="userSpaceOnUse">
