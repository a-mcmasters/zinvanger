<!doctype html>
<!-- PROTOTYPE (S13), throwaway: compares the Codex icon candidates at real sizes, on light and dark toolbars. -->
<html><head><meta charset="utf-8"><title>Zinvanger icon candidates</title>
<style>
  body { margin: 0; padding: 28px; font: 14px system-ui, sans-serif; background: #f4f2f7; color: #1c1a22; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .opt { background: #fff; border-radius: 18px; padding: 18px; text-align: center; }
  h3 { margin: 10px 0 0; font-size: 15px; }
  .sizes { display: flex; gap: 12px; align-items: end; justify-content: center; margin-top: 12px; }
  .bar { margin-top: 8px; display: flex; justify-content: center; gap: 10px; padding: 6px; border-radius: 8px; background: #dee1e6; }
  .bar.d { background: #35363a; }
  img { display: block; }
</style></head><body>
<div class="grid" id="grid"></div>
<script>
const ids = ['codex-catcher', 'codex-glass', 'codex-dutch'].flatMap((d) => ['a', 'b'].map((v) => `${d}/icon-${v}.svg`));
const img = (src, s) => `<img src="${src}" width="${s}" height="${s}" onerror="this.closest('.opt')?.remove()">`;
grid.innerHTML = ids.map((src) => `<div class="opt">${img(src, 128)}<h3>${src.replace('/icon-', ' · ').replace('.svg', '')}</h3>
  <div class="sizes">${img(src, 48)}${img(src, 32)}${img(src, 16)}</div>
  <div class="bar">${img(src, 16)}</div><div class="bar d">${img(src, 16)}</div></div>`).join('');
</script>
</body></html>
