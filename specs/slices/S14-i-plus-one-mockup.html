<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zinvanger i+1 word card flow</title>
<div id="zinvanger-flow">
  <style>
    #zinvanger-flow { color-scheme: light dark; font: 14px/1.45 system-ui,sans-serif; color: light-dark(#262238,#eceaf5); }
    #zinvanger-flow * { box-sizing: border-box; }
    #zinvanger-flow [hidden] { display: none !important; }
    #zinvanger-flow button { font: inherit; cursor: pointer; }
    #zinvanger-flow button:disabled { cursor: default; }
    #zinvanger-flow button:focus-visible { outline: 2px solid #b393ff; outline-offset: 3px; }
    #zinvanger-flow .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    #zinvanger-flow .step { padding: 7px 11px; color: inherit; background: none; border: 1px solid transparent; border-radius: 8px; }
    #zinvanger-flow .step[aria-pressed="true"] { border-color: light-dark(#d9cee9,#51446f); background: light-dark(#f1eafb,#2b213e); }
    #zinvanger-flow .player { color-scheme: dark; position: relative; min-height: 338px; color: #faf8ff; isolation: isolate; overflow: hidden; border-radius: 15px; border: 1px solid #373247; background: radial-gradient(ellipse at 68% 13%,#55547c 0%,#302e4b 44%,#171a29 80%); }
    #zinvanger-flow .scene { position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg,#10111b 0%,transparent 54%); overflow: hidden; }
    #zinvanger-flow .scene::before { content: ""; position: absolute; inset: 22% -15% -56%; background: #212139; border-radius: 50%; transform: rotate(-9deg); }
    #zinvanger-flow .scene::after { content: ""; position: absolute; inset: 44% -20% -50% 19%; background: linear-gradient(135deg,#31304a,#141522 55%); border-radius: 48%; transform: rotate(-12deg); }
    #zinvanger-flow .screen { display: grid; grid-template-rows: auto minmax(188px,1fr) auto auto; min-height: inherit; padding: 14px 14px 10px; gap: 10px; }
    #zinvanger-flow .topline { display: flex; justify-content: space-between; gap: 9px; color: #e3def0; font-size: 12px; }
    #zinvanger-flow .word-area { display: flex; align-items: end; justify-content: center; }
    #zinvanger-flow .word-card { position: relative; width: min(100%,310px); padding: 14px 15px; border-radius: 13px; background: #232031; border: 1px solid #584871; box-shadow: 0 7px 23px #11101bc9; }
    #zinvanger-flow .word-card::after { content: ""; position: absolute; bottom: -6px; left: calc(50% - 5px); width: 10px; height: 10px; background: #232031; border-right: 1px solid #584871; border-bottom: 1px solid #584871; transform: rotate(45deg); }
    #zinvanger-flow .word-card h3 { font-size: 21px; line-height: 1.2; margin: 0 32px 4px 0; }
    #zinvanger-flow .word-card p { margin: 0; color: #e3daee; }
    #zinvanger-flow .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 13px; }
    #zinvanger-flow .act, #zinvanger-flow .close, #zinvanger-flow .play { color: inherit; background: none; border: 1px solid #665b77; border-radius: 8px; padding: 6px 10px; }
    #zinvanger-flow .mine { background: #c4acff; color: #23163b; border-color: #c4acff; }
    #zinvanger-flow .act:disabled { border-color: #51495d; color: #d9d0e5; background: #30293c; }
    #zinvanger-flow .close { position: absolute; top: 8px; right: 9px; padding: 3px 8px; border-color: transparent; }
    #zinvanger-flow .subtitle { justify-self: center; max-width: 100%; text-align: center; background: #13101dec; border-radius: 7px; padding: 6px 10px; font-size: clamp(16px,3.4vw,23px); }
    #zinvanger-flow .word { border: 0; padding: 0 2px; background: transparent; color: inherit; border-radius: 3px; }
    #zinvanger-flow .word[data-marked="true"] { text-decoration: underline dotted #f0cc82 2px; text-underline-offset: 5px; }
    #zinvanger-flow .word[aria-expanded="true"] { background: #574478; }
    #zinvanger-flow .transport { display: flex; align-items: center; gap: 9px; color: #e3def0; font-size: 12px; }
    #zinvanger-flow .play { min-width: 65px; padding-block: 4px; }
    #zinvanger-flow .timeline { height: 3px; flex: 1; background: linear-gradient(to right,#ba9afc 34%,#665f76 34%); border-radius: 3px; }
    #zinvanger-flow .hint { margin: 10px 0 0; min-height: 2.9em; color: light-dark(#50465f,#c9bfd9); }
    @media (pointer: coarse) {
      #zinvanger-flow .step, #zinvanger-flow .act, #zinvanger-flow .play { min-height: 44px; }
      #zinvanger-flow .word { min-height: 44px; }
    }
  </style>
  <nav class="steps" aria-label="Mockup states">
    <button class="step" type="button" data-state="watch">Watching</button>
    <button class="step" type="button" data-state="lookup">Word card</button>
    <button class="step" type="button" data-state="known">Marked known</button>
    <button class="step" type="button" data-state="mined">Mined</button>
  </nav>
  <section class="player" aria-label="Zinvanger player mockup">
    <div class="scene" aria-hidden="true"></div>
    <div class="screen">
      <div class="topline"><span>Zinvanger</span><span data-playback>Playing</span></div>
      <div class="word-area">
        <article class="word-card" id="zf-word-card" aria-label="Definition of straks" hidden>
          <button class="close" type="button" aria-label="Close word card">×</button>
          <h3 lang="nl">straks</h3>
          <p>in a little while · later</p>
          <div class="actions">
            <button class="act known" type="button">Known</button>
            <button class="act mine" type="button">Mine</button>
          </div>
        </article>
      </div>
      <div class="subtitle" lang="nl">Ik kom <button class="word" type="button" aria-controls="zf-word-card" aria-expanded="false">straks</button> terug.</div>
      <div class="transport"><button class="play" type="button">Pause</button><span class="timeline" aria-hidden="true"></span><span>08:42 / 25:16</span></div>
    </div>
  </section>
  <p class="hint" role="status">The dotted underline marks the one new word. Playback continues until you click it.</p>
  <script>
    (() => {
      const root = document.getElementById('zinvanger-flow');
      const steps = [...root.querySelectorAll('[data-state]')];
      const card = root.querySelector('.word-card');
      const word = root.querySelector('.word');
      const known = root.querySelector('.known');
      const mine = root.querySelector('.mine');
      const close = root.querySelector('.close');
      const play = root.querySelector('.play');
      const playback = root.querySelector('[data-playback]');
      const hint = root.querySelector('.hint');
      const hints = {
        watch: 'The dotted underline marks the one new word. Playback continues until you click it.',
        lookup: 'Clicking the word pauses playback and opens its meaning. Choose Known or Mine.',
        known: 'Saved to your Zinvanger vocabulary. The dotted underline disappears.',
        mined: 'Saved to Anki with the subtitle and its original audio.'
      };
      let state = 'watch';
      let savedKnown = false;
      let savedMined = false;
      let confirmedKnown = false;
      let confirmedMined = false;
      let playing = true;
      function render() {
        const open = state !== 'watch';
        steps.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.state === state)));
        card.hidden = !open;
        word.setAttribute('aria-expanded', String(open));
        word.dataset.marked = String(!savedKnown && !savedMined);
        known.textContent = confirmedKnown ? '✓ Marked known' : 'Known';
        known.disabled = confirmedKnown;
        mine.textContent = confirmedMined ? '✓ Mined' : 'Mine';
        mine.disabled = confirmedMined;
        play.textContent = playing ? 'Pause' : 'Play';
        playback.textContent = playing ? 'Playing' : 'Paused';
        hint.textContent = state === 'watch' && (savedKnown || savedMined || !playing)
          ? (playing ? 'Playback resumed.' : 'The word card is closed. Press Play to resume.')
          : hints[state];
      }
      steps.forEach(button => button.addEventListener('click', () => {
        state = button.dataset.state;
        savedKnown = state === 'known';
        savedMined = state === 'mined';
        confirmedKnown = savedKnown;
        confirmedMined = savedMined;
        playing = state === 'watch';
        render();
      }));
      word.addEventListener('click', () => {
        if (state === 'watch') state = 'lookup';
        playing = false;
        render();
        close.focus();
      });
      known.addEventListener('click', () => { savedKnown = confirmedKnown = true; state = 'known'; render(); close.focus(); });
      mine.addEventListener('click', () => { savedMined = confirmedMined = true; state = 'mined'; render(); close.focus(); });
      function dismiss() {
        state = 'watch';
        confirmedKnown = false;
        confirmedMined = false;
        render();
      }
      close.addEventListener('click', () => { dismiss(); word.focus(); });
      root.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !card.hidden) close.click();
      });
      play.addEventListener('click', () => { playing = !playing; dismiss(); });
      render();
    })();
  </script>
</div>
</html>
